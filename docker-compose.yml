version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: shop_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: ":8080"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: shop_db
      DB_SSLMODE: disable
      JWT_SECRET: "super-secret-key-production-change-me"
      JWT_TTL: "24h"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
